[workspace]
name = "omnigen2-editscore-desktop"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
pytorch = ">=2.8"
torchvision = "*"
transformers = "4.51.3.*"
diffusers = "0.33.1.*"
accelerate = "*"
peft = ">=0.13.1"
einops = "*"
timm = "*"
scipy = "*"
pillow = "*"
omegaconf = "*"
python-dotenv = "*"
gradio = "5.*"

[target.linux-64.dependencies]
pytorch = { version = ">=2.8", build = "cuda*" }

[target.win-64.dependencies]
pytorch = { version = ">=2.8", build = "cuda*" }

[system-requirements]
cuda = "12"

[tasks]
edit = "python omnigen2_edit.py"
